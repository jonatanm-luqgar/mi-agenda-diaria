<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda Diaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b101d; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
    .card-bg { background-color: #111827; border: 1px solid #1f293d; }
    .input-bg { background-color: #1a2333; border: 1px solid #28354d; color: #f3f4f6; }
    .input-bg:focus { outline: none; border-color: #3b82f6; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6 custom-scrollbar">

  <!-- ENCABEZADO -->
  <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-blue-600 rounded-xl text-white shadow-lg">
        <i class="fa-regular fa-calendar-check text-2xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">Mi Agenda Diaria</h1>
        <p class="text-xs text-gray-400">Planificador de bloques de 30 min</p>
      </div>
    </div>

    <!-- FECHA Y NAVEGACIÓN -->
    <div class="flex items-center gap-2 self-center">
      <button onclick="changeDate(-1)" class="p-2 card-bg rounded-lg text-gray-300 hover:bg-gray-800 transition"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="flex items-center gap-2 card-bg px-4 py-2 rounded-lg text-sm text-white font-medium">
        <i class="fa-regular fa-calendar text-blue-400"></i>
        <input type="date" id="datePicker" class="bg-transparent border-none text-white focus:outline-none cursor-pointer" onchange="onDateChange(this.value)">
      </div>
      <button onclick="changeDate(1)" class="p-2 card-bg rounded-lg text-gray-300 hover:bg-gray-800 transition"><i class="fa-solid fa-chevron-right"></i></button>
      <button onclick="goToToday()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow transition">Hoy</button>
    </div>

    <!-- ACCIONES Y SINCRONIZACIÓN -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
        <input type="text" id="syncIdInput" placeholder="ID Sincro (ej: mi-agenda)" class="bg-transparent text-xs text-white focus:outline-none w-32">
        <button onclick="initSync()" class="text-xs text-blue-400 hover:text-blue-300 font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Sincronizar
        </button>
      </div>
      <span id="syncStatusText" class="text-xs font-medium text-emerald-400"></span>
    </div>
  </header>

  <!-- VISTA PRINCIPAL -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1600px] mx-auto">
    
    <!-- COLUMNA IZQUIERDA: BLOQUES DE TIEMPO -->
    <section class="lg:col-span-7 card-bg rounded-2xl p-5 shadow-xl flex flex-col h-[calc(100vh-140px)]">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <i class="fa-regular fa-clock text-blue-400"></i>
          <h2 class="text-lg font-bold text-white">Bloques de Tiempo</h2>
        </div>
        <button onclick="clearBlocks()" class="text-xs text-gray-400 hover:text-red-400 transition flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Limpiar
        </button>
      </div>

      <div id="timeBlocksContainer" class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-2">
        <!-- Generado dinámicamente -->
      </div>
    </section>

    <!-- COLUMNA DERECHA: CALENDARIO MINI, TAREAS Y NOTAS -->
    <section class="lg:col-span-5 space-y-6 flex flex-col h-[calc(100vh-140px)]">
      
      <!-- MINI CALENDARIO -->
      <div class="card-bg rounded-2xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-blue-400"></i>
            <h2 class="text-base font-bold text-white">Calendario</h2>
          </div>
          <button onclick="openFullCalendar()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
            <i class="fa-solid fa-up-right-from-square"></i> Abrir
          </button>
        </div>
        <div id="miniCalendar" class="grid grid-cols-7 gap-1 text-center text-xs">
          <!-- Generado dinámicamente -->
        </div>
      </div>

      <!-- TAREAS DEL DÍA -->
      <div class="card-bg rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <i class="fa-regular fa-square-check text-emerald-400"></i>
            <h2 class="text-base font-bold text-white">Tareas del Día</h2>
          </div>
          <span id="tasksCounter" class="text-xs text-gray-400 bg-gray-800 px-2 py-0.5 rounded-full">0/0</span>
        </div>
        <div class="flex gap-2 mb-3">
          <input type="text" id="newTaskInput" placeholder="Añadir una tarea..." class="flex-1 input-bg px-3 py-2 rounded-lg text-sm" onkeypress="if(event.key==='Enter') addTask()">
          <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm shadow transition">+</button>
        </div>
        <ul id="tasksList" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1">
          <!-- Generado dinámicamente -->
        </ul>
      </div>

      <!-- APUNTES DEL DÍA -->
      <div class="card-bg rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center gap-2 mb-3">
          <i class="fa-regular fa-file-lines text-amber-400"></i>
          <h2 class="text-base font-bold text-white">Apuntes del Día</h2>
        </div>
        <textarea id="notesArea" placeholder="Escribe aquí ideas, reflexiones o recordatorios..." class="w-full flex-1 input-bg p-3 rounded-lg text-sm resize-none custom-scrollbar" oninput="saveNotes()"></textarea>
      </div>

    </section>
  </div>

  <!-- MODAL COMPLETO DEL CALENDARIO DE EVENTOS -->
  <div id="calendarModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden justify-center items-center p-4">
    <div class="card-bg w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- Cabecera Modal -->
      <div class="p-4 bg-slate-900 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-blue-600 rounded-lg text-white">
            <i class="fa-regular fa-calendar-plus text-xl"></i>
          </div>
          <div>
            <h3 class="text-lg font-bold text-white">Calendario de Eventos</h3>
            <p class="text-xs text-gray-400">Haz clic en un día para agregar o ver eventos</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="changeModalMonth(-1)" class="p-2 card-bg rounded-lg text-gray-300 hover:bg-gray-800"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="modalMonthTitle" class="text-sm font-bold text-white uppercase tracking-wider">OCTUBRE DE 2026</span>
          <button onclick="changeModalMonth(1)" class="p-2 card-bg rounded-lg text-gray-300 hover:bg-gray-800"><i class="fa-solid fa-chevron-right"></i></button>
          <button onclick="closeFullCalendar()" class="p-2 text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <!-- Cuadrícula del Calendario -->
      <div class="p-4 overflow-y-auto custom-scrollbar flex-1">
        <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-semibold text-gray-400 uppercase">
          <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
        </div>
        <div id="modalCalendarGrid" class="grid grid-cols-7 gap-2">
          <!-- Días renderizados dinámicamente -->
        </div>
      </div>

      <!-- Panel Inferior de Eventos del Día Seleccionado -->
      <div class="p-4 border-t border-gray-800 bg-slate-900/50">
        <div id="selectedDayTitle" class="text-sm font-bold text-white mb-2">Selecciona un día</div>
        
        <!-- Lista de Eventos -->
        <div id="selectedDayEvents" class="flex flex-wrap gap-2 mb-3 max-h-24 overflow-y-auto custom-scrollbar">
          <!-- Eventos del día -->
        </div>

        <!-- Formulario para Nuevo Evento -->
        <div class="flex flex-col sm:flex-row gap-3 items-center">
          <input type="text" id="newEventInput" placeholder="Ej: Examen de Ccalculo, Cita médica..." class="flex-1 input-bg px-3 py-2 rounded-lg text-sm w-full">
          
          <!-- Selector de Colores -->
          <div class="flex items-center gap-2">
            <button onclick="selectColor('#3b82f6')" class="color-btn w-6 h-6 rounded-full bg-blue-500 ring-2 ring-white"></button>
            <button onclick="selectColor('#ef4444')" class="color-btn w-6 h-6 rounded-full bg-red-500"></button>
            <button onclick="selectColor('#10b981')" class="color-btn w-6 h-6 rounded-full bg-emerald-500"></button>
            <button onclick="selectColor('#eab308')" class="color-btn w-6 h-6 rounded-full bg-yellow-500"></button>
            <button onclick="selectColor('#a855f7')" class="color-btn w-6 h-6 rounded-full bg-purple-500"></button>
            <button onclick="selectColor('#f97316')" class="color-btn w-6 h-6 rounded-full bg-orange-500"></button>
          </div>

          <button onclick="addCalendarEvent()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 w-full sm:w-auto justify-center">
            <i class="fa-solid fa-plus"></i> Agregar evento
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- SCRIPT Y LÓGICA -->
  <script>
    // Inicialización de Variables
    let currentDate = new Date(2026, 9, 28); // 28 Octubre 2026
    let modalDate = new Date(2026, 9, 28);
    let selectedModalDateStr = "2026-10-28";
    let selectedColor = "#3b82f6";

    // Datos globales
    let timeBlocksData = {};
    let tasksData = {};
    let notesData = {};
    let calendarEventsData = {};

    // Configuración Firebase (Demostración Pública / Base de Datos Temporal)
    const firebaseConfig = {
      databaseURL: "https://agenda-diaria-default-rtdb.firebaseio.com"
    };

    let syncDbRef = null;

    // --- FUNCIÓN DE SINCRONIZACIÓN MEJORADA (COMPATIBLE CON IPHONE/SAFARI) ---
    function initSync() {
      const syncId = document.getElementById('syncIdInput').value.trim();
      if (!syncId) {
        alert("Introduce un ID de sincronización (ejemplo: mi-agenda-2026).");
        return;
      }

      if (syncDbRef) syncDbRef.off();

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        db.goOnline(); // Fuerza reconexión en iOS Safari

        syncDbRef = db.ref('agendas/' + syncId);

        // Escuchar datos en tiempo real
        syncDbRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            if (data.blocks) timeBlocksData = data.blocks;
            if (data.tasks) tasksData = data.tasks;
            if (data.notes) notesData = data.notes;
            if (data.events) calendarEventsData = data.events;

            renderTimeBlocks();
            renderTasks();
            renderNotes();
            renderMiniCalendar();
            if (document.getElementById('calendarModal').style.display === 'flex') {
              renderFullCalendar();
            }
          }
        }, (err) => {
          console.error("Error de sincronización:", err);
        });

        localStorage.setItem('agenda_sync_id', syncId);
        document.getElementById('syncStatusText').innerText = "Conectado: " + syncId;
        alert("¡Sincronización activada correctamente en este dispositivo!");
      } catch (e) {
        console.error(e);
        alert("Error al conectar con la base de datos de sincronización.");
      }
    }

    function pushData() {
      if (syncDbRef) {
        syncDbRef.set({
          blocks: timeBlocksData,
          tasks: tasksData,
          notes: notesData,
          events: calendarEventsData
        });
      }
    }

    // --- MANEJO DE FECHAS ---
    function formatDate(d) {
      return d.toISOString().split('T')[0];
    }

    function updateDateUI() {
      document.getElementById('datePicker').value = formatDate(currentDate);
      renderTimeBlocks();
      renderTasks();
      renderNotes();
      renderMiniCalendar();
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      updateDateUI();
    }

    function goToToday() {
      currentDate = new Date(2026, 9, 28);
      updateDateUI();
    }

    function onDateChange(val) {
      if (val) {
        const parts = val.split('-');
        currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
        updateDateUI();
      }
    }

    // --- BLOQUES DE TIEMPO ---
    function renderTimeBlocks() {
      const container = document.getElementById('timeBlocksContainer');
      container.innerHTML = '';
      const dateStr = formatDate(currentDate);
      const dayBlocks = timeBlocksData[dateStr] || {};

      for (let h = 6; h <= 23; h++) {
        for (let m of [0, 30]) {
          const timeKey = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          const nextM = m === 0 ? 30 : 0;
          const nextH = m === 0 ? h : h + 1;
          const nextTimeKey = `${String(nextH).padStart(2, '0')}:${String(nextM).padStart(2, '0')}`;
          
          const text = dayBlocks[timeKey] || '';

          const row = document.createElement('div');
          row.className = 'flex items-center gap-3 p-2 bg-slate-900/60 rounded-xl border border-slate-800/80 hover:border-slate-700 transition';
          row.innerHTML = `
            <div class="w-16 text-xs text-gray-400 font-mono font-medium">
              <div>${timeKey}</div>
              <div class="text-[10px] text-gray-600">${nextTimeKey}</div>
            </div>
            <input type="text" value="${text}" placeholder="¿Qué hiciste o planeas hacer?" 
                   class="flex-1 input-bg px-3 py-1.5 rounded-lg text-sm"
                   onchange="saveBlock('${timeKey}', this.value)">
          `;
          container.appendChild(row);
        }
      }
    }

    function saveBlock(timeKey, value) {
      const dateStr = formatDate(currentDate);
      if (!timeBlocksData[dateStr]) timeBlocksData[dateStr] = {};
      timeBlocksData[dateStr][timeKey] = value;
      pushData();
    }

    function clearBlocks() {
      if (confirm("¿Limpiar bloques de hoy?")) {
        const dateStr = formatDate(currentDate);
        timeBlocksData[dateStr] = {};
        renderTimeBlocks();
        pushData();
      }
    }

    // --- TAREAS ---
    function renderTasks() {
      const list = document.getElementById('tasksList');
      list.innerHTML = '';
      const dateStr = formatDate(currentDate);
      const dayTasks = tasksData[dateStr] || [];

      let completedCount = 0;
      dayTasks.forEach((task, index) => {
        if (task.done) completedCount++;
        const li = document.createElement('li');
        li.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-900/80 border border-slate-800';
        li.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${index})" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-0">
            <span class="text-sm ${task.done ? 'line-through text-gray-500' : 'text-gray-200'}">${task.text}</span>
          </div>
          <button onclick="deleteTask(${index})" class="text-xs text-gray-500 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
        `;
        list.appendChild(li);
      });

      document.getElementById('tasksCounter').innerText = `${completedCount}/${dayTasks.length}`;
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      const text = input.value.trim();
      if (!text) return;
      const dateStr = formatDate(currentDate);
      if (!tasksData[dateStr]) tasksData[dateStr] = [];
      tasksData[dateStr].push({ text, done: false });
      input.value = '';
      renderTasks();
      pushData();
    }

    function toggleTask(index) {
      const dateStr = formatDate(currentDate);
      tasksData[dateStr][index].done = !tasksData[dateStr][index].done;
      renderTasks();
      pushData();
    }

    function deleteTask(index) {
      const dateStr = formatDate(currentDate);
      tasksData[dateStr].splice(index, 1);
      renderTasks();
      pushData();
    }

    // --- NOTAS ---
    function renderNotes() {
      const dateStr = formatDate(currentDate);
      document.getElementById('notesArea').value = notesData[dateStr] || '';
    }

    function saveNotes() {
      const dateStr = formatDate(currentDate);
      notesData[dateStr] = document.getElementById('notesArea').value;
      pushData();
    }

    // --- MINI CALENDARIO ---
    function renderMiniCalendar() {
      const mini = document.getElementById('miniCalendar');
      mini.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const daysOfWeek = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
      daysOfWeek.forEach(d => {
        mini.innerHTML += `<div class="text-gray-500 font-bold py-1">${d}</div>`;
      });

      let offset = firstDay === 0 ? 6 : firstDay - 1;
      for (let i = 0; i < offset; i++) {
        mini.innerHTML += `<div></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === currentDate.getDate();
        mini.innerHTML += `
          <div class="py-1 rounded-md text-xs cursor-pointer ${isToday ? 'bg-blue-600 text-white font-bold' : 'hover:bg-slate-800 text-gray-300'}"
               onclick="selectMiniCalendarDay(${d})">
            ${d}
          </div>
        `;
      }
    }

    function selectMiniCalendarDay(day) {
      currentDate.setDate(day);
      updateDateUI();
    }

    // --- MODAL DE CALENDARIO DE EVENTOS ---
    function openFullCalendar() {
      modalDate = new Date(currentDate);
      document.getElementById('calendarModal').style.display = 'flex';
      renderFullCalendar();
    }

    function closeFullCalendar() {
      document.getElementById('calendarModal').style.display = 'none';
    }

    function changeModalMonth(diff) {
      modalDate.setMonth(modalDate.getMonth() + diff);
      renderFullCalendar();
    }

    function renderFullCalendar() {
      const year = modalDate.getFullYear();
      const month = modalDate.getMonth();
      
      const monthsEs = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      document.getElementById('modalMonthTitle').innerText = `${monthsEs[month]} de ${year}`;

      const grid = document.getElementById('modalCalendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let offset = firstDay === 0 ? 6 : firstDay - 1;
      for (let i = 0; i < offset; i++) {
        grid.innerHTML += `<div class="h-20 bg-slate-900/30 rounded-xl"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayEvents = calendarEventsData[dStr] || [];
        const isSelected = dStr === selectedModalDateStr;

        let eventsPills = dayEvents.map(e => `
          <div class="text-[10px] truncate px-1.5 py-0.5 rounded text-white" style="background-color: ${e.color}">
            ● ${e.title}
          </div>
        `).join('');

        const dayCard = document.createElement('div');
        dayCard.className = `h-20 card-bg p-1.5 rounded-xl border flex flex-col justify-between cursor-pointer transition relative ${isSelected ? 'border-blue-500 ring-2 ring-blue-500/50' : 'hover:border-gray-700'}`;
        dayCard.onclick = () => selectModalDay(dStr);

        dayCard.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-gray-200">${d}</span>
            ${dayEvents.length > 0 ? `<span class="bg-blue-600 text-white text-[10px] px-1.5 rounded-full">${dayEvents.length}</span>` : ''}
          </div>
          <div class="space-y-1 overflow-hidden">
            ${eventsPills}
          </div>
        `;
        grid.appendChild(dayCard);
      }

      renderSelectedDayEvents();
    }

    function selectModalDay(dateStr) {
      selectedModalDateStr = dateStr;
      renderFullCalendar();
    }

    function renderSelectedDayEvents() {
      const title = document.getElementById('selectedDayTitle');
      const eventsContainer = document.getElementById('selectedDayEvents');
      
      const parts = selectedModalDateStr.split('-');
      title.innerText = `Eventos para el ${parts[2]}/${parts[1]}/${parts[0]}:`;

      const dayEvents = calendarEventsData[selectedModalDateStr] || [];
      eventsContainer.innerHTML = '';

      if (dayEvents.length === 0) {
        eventsContainer.innerHTML = `<span class="text-xs text-gray-500">No hay eventos para este día.</span>`;
        return;
      }

      dayEvents.forEach((ev, idx) => {
        const tag = document.createElement('div');
        tag.className = 'flex items-center gap-2 px-2.5 py-1 rounded-full text-xs text-white shadow';
        tag.style.backgroundColor = ev.color;
        tag.innerHTML = `
          <span>● ${ev.title}</span>
          <button onclick="deleteCalendarEvent(${idx})" class="hover:text-red-200"><i class="fa-solid fa-xmark"></i></button>
        `;
        eventsContainer.appendChild(tag);
      });
    }

    function selectColor(colorHex) {
      selectedColor = colorHex;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-white'));
      event.target.classList.add('ring-2', 'ring-white');
    }

    function addCalendarEvent() {
      const input = document.getElementById('newEventInput');
      const title = input.value.trim();
      if (!title) return;

      if (!calendarEventsData[selectedModalDateStr]) {
        calendarEventsData[selectedModalDateStr] = [];
      }

      calendarEventsData[selectedModalDateStr].push({ title, color: selectedColor });
      input.value = '';
      renderFullCalendar();
      pushData();
    }

    function deleteCalendarEvent(index) {
      calendarEventsData[selectedModalDateStr].splice(index, 1);
      renderFullCalendar();
      pushData();
    }

    // Inicializar al cargar
    window.onload = () => {
      updateDateUI();
      const savedSyncId = localStorage.getItem('agenda_sync_id');
      if (savedSyncId) {
        document.getElementById('syncIdInput').value = savedSyncId;
        initSync();
      }
    };
  </script>
</body>
</html>

  </script>
</body>
</html>
